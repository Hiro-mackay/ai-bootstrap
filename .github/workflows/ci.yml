name: CI

# Build-only smoke: does the committed state build from a clean checkout?
# Correctness guards (lint, tidy, type-check, test, coverage, architecture) are
# defined once in the Taskfile and run locally (lefthook + the agent loop);
# supply-chain/security monitoring lives in security-audit.yml. See docs/harness.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Language
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect project language
        id: check
        run: |
          echo "node=$([[ -f frontend/package.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "go=$([[ -f backend/go.mod ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  node:
    name: Node.js Build
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Detect package manager
        id: pm
        run: |
          if [[ -f frontend/bun.lock ]]; then
            echo "manager=bun" >> "$GITHUB_OUTPUT"
          elif [[ -f frontend/pnpm-lock.yaml ]]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f frontend/yarn.lock ]]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.pm.outputs.manager != 'bun'
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: frontend/

      - name: Setup Bun
        if: steps.pm.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Setup pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        working-directory: frontend
        run: |
          case "${{ steps.pm.outputs.manager }}" in
            bun)  bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto
        run: buf generate

      - name: Build
        working-directory: frontend
        run: |
          PM="${{ steps.pm.outputs.manager }}"
          $PM run build

  go:
    name: Go Build
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto
        run: buf generate

      - name: Build
        run: task go:build:check
