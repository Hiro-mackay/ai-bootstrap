name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Language
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      go: ${{ steps.check.outputs.go }}
      python: ${{ steps.check.outputs.python }}
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect project language
        id: check
        run: |
          echo "node=$([[ -f frontend/package.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "go=$([[ -f backend/go.mod ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([[ -f requirements.txt || -f pyproject.toml || -f setup.py ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust=$([[ -f Cargo.toml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  node:
    name: Node.js
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Detect package manager
        id: pm
        run: |
          if [[ -f frontend/bun.lock ]]; then
            echo "manager=bun" >> "$GITHUB_OUTPUT"
          elif [[ -f frontend/pnpm-lock.yaml ]]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f frontend/yarn.lock ]]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.pm.outputs.manager != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: frontend/

      - name: Setup Bun
        if: steps.pm.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Setup pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        working-directory: frontend
        run: |
          case "${{ steps.pm.outputs.manager }}" in
            bun)  bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto
        run: buf generate

      - name: Lint
        working-directory: frontend
        run: |
          PM="${{ steps.pm.outputs.manager }}"
          $PM run lint

      - name: Build
        working-directory: frontend
        run: |
          PM="${{ steps.pm.outputs.manager }}"
          $PM run build

      - name: Test
        working-directory: frontend
        run: |
          PM="${{ steps.pm.outputs.manager }}"
          $PM run test

      - name: Audit
        working-directory: frontend
        run: |
          PM="${{ steps.pm.outputs.manager }}"
          case "$PM" in
            bun)  bun pm audit 2>/dev/null || true ;;
            pnpm) pnpm audit --audit-level=high ;;
            *)    npm audit --audit-level=high ;;
          esac

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x" # latest 1.25 patch -> patched stdlib for govulncheck
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto
        run: buf generate

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: backend

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Test
        working-directory: backend
        run: go test ./... -race

      - name: Domain coverage gate
        run: sh scripts/check-coverage.sh

      # Blocks on reachable dependency vulnerabilities (actionable); reports
      # stdlib advisories without blocking (they track Go releases, not the diff).
      - name: Vulnerability Check
        run: sh scripts/govulncheck-gate.sh

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          if [[ -f pyproject.toml ]]; then pip install .[dev] 2>/dev/null || pip install .; fi

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: |
          if command -v pytest &>/dev/null; then
            pytest
          elif [[ -d tests ]]; then
            python -m unittest discover tests
          fi

      - name: Audit
        run: |
          pip install pip-audit 2>/dev/null
          pip-audit 2>/dev/null || true

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Audit
        run: |
          cargo install cargo-audit 2>/dev/null || true
          cargo audit 2>/dev/null || true

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Architecture fitness tests
        run: sh scripts/check-architecture.sh
