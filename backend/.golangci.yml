version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
    - godox
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

formatters:
  enable:
    - gofumpt

issues:
  exclude-dirs:
    - bin
    - tmp
    - vendor
