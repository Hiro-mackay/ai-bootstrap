version: '3'

tasks:
  dev:
    desc: Start development server with hot-reload
    deps: [install-tools]
    cmd: air

  build:
    desc: Build the server binary
    cmd: go build -o bin/server ./cmd/server

  build:check:
    desc: Compile all packages (clean-build smoke for CI)
    cmd: go build ./...

  test:
    desc: Run tests
    cmd: go test ./... -v -race -count=1

  lint:
    desc: Run linter (govet + staticcheck deprecation incl.)
    cmd: golangci-lint run

  vuln:
    desc: Block on reachable dependency vulnerabilities (run on dep bumps; weekly via security-audit.yml)
    cmd: sh ../scripts/govulncheck-gate.sh

  format:
    desc: Format code
    cmd: golangci-lint fmt

  clean:
    desc: Remove build artifacts
    cmd: rm -rf bin/ tmp/

  migrate:up:
    desc: Run database migrations up
    cmd: migrate -path migrations -database "${DATABASE_URL}" up

  migrate:down:
    desc: Rollback last database migration
    cmd: migrate -path migrations -database "${DATABASE_URL}" down 1

  migrate:create:
    desc: Create a new migration (usage -- task go:migrate:create -- NAME)
    cmd: migrate create -ext sql -dir migrations -seq {{.CLI_ARGS}}

  sqlc:generate:
    desc: Generate Go code from SQL queries
    cmd: sqlc generate

  tidy:
    desc: Tidy go.mod dependencies
    cmd: go mod tidy

  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy
    cmd: go mod tidy -e -diff

  install-tools:
    desc: Install development tools
    cmds:
      - go install github.com/air-verse/air@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
    status:
      - which air
      - which sqlc
      - which migrate
