version: '3'

tasks:
  dev:
    desc: Start development server (generates routes, then serves)
    cmd: bun run dev

  dev:watch-routes:
    desc: Watch for route file changes (run alongside dev when adding routes)
    cmd: bun run routes:watch

  build:
    desc: Build for production (generates routes first)
    cmd: bun run build

  routes:generate:
    desc: Generate route tree from file-based routes
    cmd: bun run routes:generate

  shadcn:
    desc: "Install a shadcn/ui primitive into components/primitives (usage: task react:shadcn -- button). Update components/primitives/INDEX.md after."
    cmd: bunx shadcn@latest add {{.CLI_ARGS}}

  preview:
    desc: Preview production build
    cmd: bun run preview

  test:
    desc: Run tests
    cmd: bun run test

  test:watch:
    desc: Run tests in watch mode
    cmd: bun run test:watch

  lint:
    desc: Lint and format check
    cmd: bun run lint

  format:
    desc: Lint and format with auto-fix
    cmd: bun run format

  type-check:
    desc: Type check
    cmd: bun run type-check

  clean:
    desc: Remove build artifacts
    cmd: rm -rf dist/

  ci:
    desc: Run CI pipeline
    cmds:
      - task: lint
      - task: type-check
      - task: test
      - task: build
