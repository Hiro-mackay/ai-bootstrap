version: '3'

tasks:
  dev:
    desc: Start development server (generates routes, then serves)
    cmd: bun run dev

  dev:watch-routes:
    desc: Watch for route file changes (run alongside dev when adding routes)
    cmd: bun run routes:watch

  build:
    desc: Build for production (generates routes first)
    deps: [install]
    cmd: bun run build

  routes:generate:
    desc: Generate route tree from file-based routes
    deps: [install]
    sources:
      - src/routes/**/*.tsx
      - src/routes/**/*.ts
    generates:
      - src/routeTree.gen.ts
    cmd: bun run routes:generate

  # node_modules is gitignored and absent in a fresh worktree; the lint/type-check/test
  # guards below need it (and the biome/tsc binaries). Skipped when already installed,
  # so this is a no-op on every commit after the first.
  install:
    internal: true
    status:
      - test -d node_modules
    cmd: bun install --frozen-lockfile

  shadcn:
    desc: "Install a shadcn/ui primitive into components/primitives (usage: task react:shadcn -- button). Update components/primitives/INDEX.md after."
    cmd: bunx shadcn@latest add {{.CLI_ARGS}}

  preview:
    desc: Preview production build
    cmd: bun run preview

  test:
    desc: Run tests
    deps: [routes:generate]
    cmd: bun run test

  test:watch:
    desc: Run tests in watch mode
    cmd: bun run test:watch

  lint:
    desc: Lint and format check
    deps: [install]
    cmd: bun run lint

  format:
    desc: Lint and format with auto-fix
    deps: [install]
    cmd: bun run format

  type-check:
    desc: Type check
    deps: [routes:generate]
    cmd: bun run type-check

  clean:
    desc: Remove build artifacts
    cmd: rm -rf dist/
