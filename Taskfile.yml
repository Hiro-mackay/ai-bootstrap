version: '3'

# .env.worktree holds this worktree's isolated ports; .env holds shared,
# port-independent config. go-task dotenv is first-wins, so .env.worktree is
# listed first -- its ports beat any stale port keys left in an old-format .env.
# See .claude/rules/multi-worktree-dev.md.
dotenv: ['.env.worktree', '.env']

includes:
  go:
    taskfile: backend/Taskfile.yml
    dir: backend
  react:
    taskfile: frontend/Taskfile.yml
    dir: frontend

tasks:
  default:
    cmd: task --list

  setup:
    desc: Prepare this checkout/worktree for development (allocate isolated ports, then full setup; idempotent)
    cmds:
      # Allocate ports into .env.worktree BEFORE the heavy steps. The next line
      # re-invokes `task` as a fresh process so it reloads dotenv and the infra /
      # migrate steps see this worktree's ports -- no re-exec hack, no runtime lock.
      - sh scripts/worktree-ports.sh ensure .
      - cmd: task setup:run

  # Not `internal` so `task setup` can re-invoke it as a fresh process (above);
  # has no `desc`, so it stays out of `task --list`.
  setup:run:
    cmds:
      - task: go:install-tools
      - task: hooks
      - task: infra:up
      - task: infra:wait
      - task: go:migrate:up
      - task: proto:gen
      - task: go:sqlc:generate
      - cmd: bun install --frozen-lockfile
        dir: frontend

  worktree:init:
    desc: Prepare a freshly created worktree (alias of `task setup`; run once after `gwa`/`git worktree add`)
    cmds:
      - task: setup

  worktree:add:
    desc: 'Create a worktree with isolated ports, for those without a `gwa` alias. Usage: task worktree:add -- <branch> [path]'
    cmd: sh scripts/worktree-ports.sh add {{.CLI_ARGS}}

  worktree:remove:
    desc: 'Remove a worktree and free its ports (--force: the generated .env/.env.worktree are untracked). Usage: task worktree:remove -- <path>'
    cmd: git worktree remove --force {{.CLI_ARGS}}

  worktree:test:
    desc: Test the worktree port allocation logic
    cmd: sh scripts/test/worktree-ports.test.sh

  context:
    desc: 'Surface the touched files'' context annotations + matching domain-definitions.md block (#34). Usage: task context [-- <base>|--path <p>]'
    cmd: sh scripts/context.sh {{.CLI_ARGS}}

  context:test:
    desc: Test the context-harness gate and surface
    cmds:
      - sh scripts/test/check-context.test.sh
      - sh scripts/test/context.test.sh

  hooks:
    desc: Install git pre-commit hooks (lint, type-check, architecture checks)
    cmds:
      - command -v lefthook >/dev/null 2>&1 || go install github.com/evilmartians/lefthook@latest
      - lefthook install

  proto:gen:
    desc: Generate code from proto files
    # Generated code is gitignored, so a fresh checkout/worktree has none. Fingerprint
    # on the proto inputs: runs when outputs are missing or stale, skips otherwise --
    # this is what lets the go guards (and coverage) self-ensure their proto code via
    # `gen-proto` without regenerating on every commit. buf emits the frontend bindings
    # too, so both output trees are tracked here.
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - backend/internal/gen/**/*.go
      - frontend/src/gen/**/*.ts
    cmd: buf generate

  proto:lint:
    desc: Lint proto files
    cmd: buf lint

  dev:
    desc: Start infrastructure and all development servers
    preconditions:
      - sh: test -f .env.worktree
        msg: "No .env.worktree -- run `task worktree:init` first to allocate this worktree's isolated dev ports."
    cmds:
      - task: infra:up
      - task: infra:wait
      - task: go:migrate:up
      - task: dev:servers

  dev:servers:
    internal: true
    deps: [go:dev, react:dev]

  infra:wait:
    internal: true
    desc: Wait for PostgreSQL to be ready
    cmd: |
      until podman compose exec -T postgres pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} > /dev/null 2>&1; do
        sleep 1
      done

  test:
    desc: Run all tests
    cmds:
      - task: go:test
      - task: react:test

  format:
    desc: Format all code
    cmds:
      - task: go:format
      - task: react:format

  format:check:
    desc: Check formatting without fixing (CI-safe)
    cmds:
      - task: react:lint

  arch:
    desc: Architecture fitness tests (layering, barrels, cross-feature, file size, escape hatches, context annotations)
    cmds:
      - sh scripts/check-architecture.sh
      - sh scripts/check-context.sh

  coverage:
    desc: Domain test coverage gate (>= 80%)
    deps: [proto:gen]
    cmd: sh scripts/check-coverage.sh

  build:
    desc: Build backend and frontend
    cmds:
      - task: go:build
      - task: react:build

  lint:
    desc: Run all linters
    cmds:
      - task: go:lint
      - task: react:lint
      - task: arch

  check:
    desc: Run all static guards (proto lint, lint, tidy, type-check, architecture)
    cmds:
      - task: proto:lint
      - task: go:lint
      - task: go:tidy:check
      - task: react:lint
      - task: react:type-check
      - task: arch

  infra:up:
    desc: Start infrastructure services (PostgreSQL)
    cmd: podman compose up -d

  infra:down:
    desc: Stop infrastructure services
    cmd: podman compose down

  infra:reset:
    desc: Stop infrastructure and remove volumes
    cmd: podman compose down -v

  logs:db:
    desc: Follow PostgreSQL logs
    cmd: podman compose logs -f postgres

  logs:backend:
    desc: Follow Go backend logs (runs server in foreground)
    cmds:
      - task: go:dev

  logs:frontend:
    desc: Follow React frontend logs (runs server in foreground)
    cmds:
      - task: react:dev

  clean:
    desc: Remove all build artifacts
    deps: [go:clean, react:clean]
