pre-commit:
  commands:
    no-commit-to-main:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then
          echo "Direct commits to main are not allowed. Use a feature branch."
          exit 1
        fi
    detect-secrets:
      # A coarse local tripwire only; gitleaks (security-audit.yml) is the real
      # scanner. --exclude=lefthook.yml avoids self-matching the patterns below,
      # so secrets must not be placed in this file.
      run: |
        if git diff --cached --diff-filter=ACM -z --name-only | \
           xargs -0 grep -lE '(PRIVATE KEY|aws_secret|password=|api_key=)' \
           --exclude=lefthook.yml 2>/dev/null; then
          echo "Potential secret detected in staged files. Remove before committing."
          exit 1
        fi
      glob: "*.{go,ts,tsx,js,jsx,json,yaml,yml,toml,env}"
    check-large-files:
      run: |
        large=$(git diff --cached --diff-filter=ACM --name-only -z | \
          xargs -0 -I{} find {} -size +1M 2>/dev/null)
        if [ -n "$large" ]; then
          echo "Files over 1MB detected:"
          echo "$large"
          exit 1
        fi
    # Guards delegate to Taskfile targets (the single definition); see docs/harness.md.
    proto-lint:
      run: task proto:lint
    go-lint:
      run: task go:lint
    go-tidy:
      run: task go:tidy:check
    frontend-lint:
      run: task react:lint
    frontend-typecheck:
      run: task react:type-check
    frontend-format:
      run: task react:format
      stage_fixed: true
    architecture:
      run: task arch

pre-push:
  commands:
    go-test:
      run: task go:test
    coverage:
      run: task coverage
    frontend-test:
      run: task react:test
